spring.application.name=BankingProject

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/banking_application?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


#JPA / Hibernate Configuration

# Automatically update/create tables based on entities
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console (for debugging)
spring.jpa.show-sql=true

#jwt
jwt.secret=${JWT_SECRET}
jwt.access-expiration-ms=90000                 
jwt.refresh-expiration-ms=2592000000    
jwt.issuer=BankingProject